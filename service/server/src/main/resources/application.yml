server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
  application:
    name: record-room-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assignment_test}
    username: ${SPRING_DATASOURCE_USERNAME:assignment_user}
    password: ${SPRING_DATASOURCE_PASSWORD:assignment_password}
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  seed:
    enabled: ${SEED_ENABLED:true}
  upload:
    memory-dir: ${MEMORY_UPLOAD_DIR:uploads/memories}
    memory-public-path: ${MEMORY_UPLOAD_PUBLIC_PATH:/uploads/memories}
    mission-dir: ${MISSION_UPLOAD_DIR:uploads/missions}
    mission-public-path: ${MISSION_UPLOAD_PUBLIC_PATH:/uploads/missions}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"
