server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - optional:file:../../.env[.properties]
      - optional:file:.env[.properties]
  application:
    name: record-room-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assignment_test}
    username: ${SPRING_DATASOURCE_USERNAME:assignment_user}
    password: ${SPRING_DATASOURCE_PASSWORD:assignment_password}
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Seoul
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:local-missing-openai-api-key}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_CHAT_TEMPERATURE:0.4}
    retry:
      max-attempts: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  seed:
    enabled: ${SEED_ENABLED:true}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-none}]"
